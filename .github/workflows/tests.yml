name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        php-version:
          - '8.5'
          - '8.4'
          - '8.3'
          - '8.2'
          - '8.1'
        typo3-version:
          - '14'
          - '13'
          - '12'
        exclude:
          # TYPO3 14 requires PHP >= 8.2, phpunit requires >= 8.3
          - php-version: '8.1'
            typo3-version: '14'
          - php-version: '8.2'
            typo3-version: '14'
          # TYPO3 13 requires PHP >= 8.2, phpunit requires >= 8.3
          - php-version: '8.1'
            typo3-version: '13'
          - php-version: '8.2'
            typo3-version: '13'
          # TYPO3 12 requires PHP >= 8.1, phpunit requires >= 8.2
          - php-version: '8.0'
            typo3-version: '12'
          - php-version: '8.1'
            typo3-version: '12'
          - php-version: '8.5'
            typo3-version: '12'


    name: Tests (PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, mbstring, pdo_sqlite
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer install --no-progress --prefer-dist --optimize-autoloader
          COMPOSER_NO_AUDIT=1 composer scenario typo3-${{ matrix.typo3-version }}

      - name: Run unit tests
        run: composer run test

      - name: Run unit tests with details
        if: failure()
        run: composer run test:detail
