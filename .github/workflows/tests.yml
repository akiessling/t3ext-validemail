name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop, testing-setup ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            typo3: '11.5'
          - php: '8.2'
            typo3: '12.4'
          - php: '8.2'
            typo3: '13.4'
          - php: '8.3'
            typo3: '14'
          - php: '8.4'
            typo3: '14'
          - php: '8.5'
            typo3: '14'

    name: Tests (PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.typo3 }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Allow insecure packages for TYPO3 11 (EOL) in CI
        if: ${{ startsWith(matrix.typo3, '11.') }}
        run: composer config audit.block-insecure false --no-interaction

      - name: Install dependencies for TYPO3 ${{ matrix.typo3 }}
        run: |
          composer require typo3/cms-core:^${{ matrix.typo3 }} --dev --no-update --no-interaction --no-progress
          composer update typo3/cms-core --with-all-dependencies --no-interaction --no-progress --no-audit

      - name: Run unit tests
        run: composer test

      - name: Run unit tests with details
        if: failure()
        run: composer test:detail