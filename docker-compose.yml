services:
  php81:
    build:
      context: .
      dockerfile: docker/php-cli/Dockerfile
      args:
        PHP_VERSION: "8.1"
    profiles: ["t11", "t12"]
    container_name: t3ext-php81
    volumes:
      - .:/workspace
      - composer-cache:/tmp/composer-cache
    working_dir: /workspace
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    command: /bin/sh

  php82:
